<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080808">
<title>Life Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;--bg1:#0e0e0e;--bg2:#131313;--bg3:#1c1c1c;--bg4:#222222;
  --text:#ffffff;--text2:#b0b0b0;--text3:#555555;--text4:#333333;
  --red:#e82020;--red-d:#b01818;--red-dim:rgba(232,32,32,0.10);--red-mid:rgba(232,32,32,0.30);
  --green:#39c976;--green-dim:rgba(57,201,118,0.12);
  --white-dim:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.18);
  --radius:4px;--radius-sm:3px;
  --font:'Barlow Condensed',system-ui,sans-serif;--mono:'Space Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --nav-h:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;min-height:100dvh;-webkit-font-smoothing:antialiased;overscroll-behavior:none;background-image:radial-gradient(rgba(255,255,255,0.035) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;z-index:1}
.tab{display:none;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 24px)}
.tab.active{display:block}
input,button,textarea,select{font-family:var(--font)}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + var(--safe-bottom));background:rgba(8,8,8,0.97);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:10px;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:4px 0;transition:color .15s;font-family:var(--mono);position:relative}
.nav-btn svg{width:20px;height:20px}
.nav-btn.active{color:var(--text)}
.nav-btn.active::before{content:'';position:absolute;top:-10px;left:20%;right:20%;height:2px;background:var(--red)}

/* HEADER */
.page-header{padding:calc(var(--safe-top) + 24px) 20px 14px;position:sticky;top:0;z-index:50;background:rgba(8,8,8,0.97);border-bottom:1px solid var(--border)}
.page-title{font-size:28px;font-weight:800;color:var(--text);letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px;line-height:1;display:flex;align-items:center;gap:10px}
.page-title::before{content:'//';color:var(--red);font-size:20px;font-family:var(--mono);font-weight:400}
.hud-scan{height:2px;background:repeating-linear-gradient(90deg,var(--red) 0,var(--red) 8px,transparent 8px,transparent 12px);margin-bottom:10px;opacity:.6}

/* CARDS */
.card{background:var(--bg1);border:1px solid var(--border);border-top:2px solid var(--red);border-radius:var(--radius);padding:18px 18px 16px;margin-bottom:12px;position:relative}
.card::before,.card::after{content:'';position:absolute;bottom:-1px;width:12px;height:12px;border-bottom:2px solid var(--red)}
.card::before{left:-1px;border-left:2px solid var(--red)}
.card::after{right:-1px;border-right:2px solid var(--red)}
.card-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;font-family:var(--mono);display:flex;align-items:center;gap:8px}
.card-label::before{content:'▸';color:var(--red);font-size:8px}

/* INPUTS */
.inp{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-family:var(--mono);font-size:13px;padding:11px 14px;outline:none;transition:border-color .15s;letter-spacing:.02em}
.inp:focus{border-color:var(--red);background:var(--bg3)}
.inp::placeholder{color:var(--text4)}
textarea.inp{resize:none;line-height:1.6}
.inp-date{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-family:var(--mono);font-size:11px;padding:6px 10px;outline:none;transition:border-color .15s;cursor:pointer;letter-spacing:.02em;-webkit-appearance:none;appearance:none}
.inp-date:focus{border-color:var(--red);color:var(--text)}
.inp-date::-webkit-calendar-picker-indicator{filter:invert(0.5) sepia(1) saturate(5) hue-rotate(300deg);cursor:pointer;opacity:.6}
.date-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.date-lbl{font-size:9px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;margin-bottom:3px;font-weight:700}

/* BUTTONS */
.btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text2);font-family:var(--mono);font-size:11px;font-weight:700;padding:10px 18px;cursor:pointer;transition:all .15s;white-space:nowrap;letter-spacing:.08em;text-transform:uppercase}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--red);color:var(--text)}
.btn-purple{background:var(--red);border-color:var(--red);color:white;font-weight:800}
.btn-purple:hover{background:var(--red-d);border-color:var(--red-d);color:white}
.btn-green{background:transparent;border-color:var(--green);color:var(--green);font-weight:700}
.btn-green:hover{background:rgba(57,201,118,0.12);color:var(--green)}
.btn-ghost{background:none;border-color:transparent;color:var(--text3);padding-left:8px;padding-right:8px}
.btn-ghost:hover{color:var(--text);border-color:transparent}
.btn-danger{background:none;border-color:transparent;color:#ff4444}
.btn-danger:hover{color:var(--red);border-color:transparent}
.btn-xs{padding:4px 10px;font-size:10px;border-radius:2px}
.sec{padding:14px 20px 0}
.row{display:flex;gap:8px;align-items:center}
.divider{height:1px;background:var(--border);margin:8px 0}
.empty-state{text-align:center;padding:40px 0;color:var(--text3);font-size:13px;line-height:2;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em}
.notify{position:fixed;top:calc(var(--safe-top) + 14px);left:50%;transform:translateX(-50%) translateY(-90px);background:var(--red);border-radius:var(--radius-sm);padding:11px 24px;font-size:12px;font-weight:700;color:white;z-index:999;white-space:nowrap;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;letter-spacing:.12em;text-transform:uppercase;font-family:var(--mono)}
.notify.show{transform:translateX(-50%) translateY(0)}

/* GOAL TABS */
.goal-tabs-bar{display:flex;gap:6px;overflow-x:auto;padding:0 20px;margin-bottom:4px;scrollbar-width:none}
.goal-tabs-bar::-webkit-scrollbar{display:none}
.gtab{flex-shrink:0;font-size:10px;font-weight:700;font-family:var(--mono);padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg1);color:var(--text3);cursor:pointer;transition:all .15s;letter-spacing:.08em;text-transform:uppercase}
.gtab.on{background:var(--red);border-color:var(--red);color:white}
.gtab:hover:not(.on){border-color:var(--text2);color:var(--text)}
.new-goal-row{display:flex;gap:8px;padding:12px 20px 0}

/* GANTT */
.gantt-wrap{background:var(--bg1);border:1px solid var(--border);border-top:2px solid var(--red);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;position:relative}
.gantt-wrap::before,.gantt-wrap::after{content:'';position:absolute;bottom:-1px;width:12px;height:12px;border-bottom:2px solid var(--red);z-index:2}
.gantt-wrap::before{left:-1px;border-left:2px solid var(--red)}
.gantt-wrap::after{right:-1px;border-right:2px solid var(--red)}
.gantt-header{padding:10px 14px 6px;display:flex;align-items:center;justify-content:space-between}
.gantt-title{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.2em;text-transform:uppercase;font-family:var(--mono);display:flex;align-items:center;gap:8px}
.gantt-title::before{content:'▸';color:var(--red);font-size:8px}
.gantt-svg-wrap{overflow-x:auto;scrollbar-width:none;padding:0 0 8px}
.gantt-svg-wrap::-webkit-scrollbar{display:none}

/* PIPELINE */
.p-node{position:relative;margin-bottom:2px}
.p-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .1s;border-left:2px solid transparent}
.p-row:hover{background:var(--bg3)}
.p-row.sel{background:var(--bg3);border-left-color:var(--red)}
.p-dot{width:14px;height:14px;border-radius:2px;border:1px solid var(--border2);background:var(--bg2);flex-shrink:0;transition:all .15s;position:relative}
.p-dot.done{background:var(--green);border-color:var(--green)}
.p-dot.done::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:white;font-weight:700}
.p-dot.act{background:var(--red);border-color:var(--red)}
.p-name{flex:1;font-size:15px;font-weight:600;color:var(--text);line-height:1.3;letter-spacing:.01em}
.p-name.done{color:var(--text3);text-decoration:line-through}
.p-acts{display:flex;gap:2px;align-items:center;flex-shrink:0}
.p-kids{padding-left:24px;border-left:1px solid var(--border);margin-left:18px;margin-top:2px}
.p-sp-badge{font-size:10px;padding:2px 7px;border-radius:2px;background:var(--red);color:white;flex-shrink:0;font-weight:700;font-family:var(--mono);letter-spacing:.06em}
.p-date-badge{font-size:9px;padding:2px 6px;border-radius:2px;background:var(--bg3);color:var(--text3);flex-shrink:0;font-family:var(--mono);letter-spacing:.04em;border:1px solid var(--border)}
.p-date-badge.has-date{color:var(--red);border-color:var(--red-mid);background:var(--red-dim)}
.add-inline{display:none;gap:6px;padding:6px 10px;align-items:center}
.add-inline.open{display:flex}

/* collapsible date rows */
.node-dates{padding:0 12px 0 34px;max-height:0;overflow:hidden;transition:max-height .22s ease,opacity .2s ease,padding .22s ease;opacity:0}
.node-dates.open{max-height:80px;opacity:1;padding:2px 12px 6px 34px}
.goal-dates-body{max-height:0;overflow:hidden;transition:max-height .22s ease,opacity .2s ease;opacity:0;padding:0 18px}
.goal-dates-body.open{max-height:80px;opacity:1;padding:0 18px 14px}

.date-toggle{display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:none;border:none;color:var(--text3);font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 4px;border-radius:2px;transition:color .15s;flex-shrink:0;line-height:1}
.date-toggle:hover{color:var(--text)}
.date-toggle .arr{display:inline-block;transition:transform .2s;font-style:normal;font-size:8px;line-height:1}
.date-toggle.open .arr{transform:rotate(90deg)}
.date-toggle.has{color:var(--red)}
.date-toggle.has:hover{color:#ff6666}

/* Gantt expand modal */
.gantt-modal{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:16px}
.gantt-modal.open{display:flex}
.gantt-modal-inner{background:var(--bg1);border:1px solid var(--border);border-top:2px solid var(--red);border-radius:var(--radius);width:100%;max-width:760px;max-height:92dvh;overflow:hidden;display:flex;flex-direction:column;position:relative}
.gantt-modal-inner::before,.gantt-modal-inner::after{content:'';position:absolute;bottom:-1px;width:12px;height:12px;border-bottom:2px solid var(--red)}
.gantt-modal-inner::before{left:-1px;border-left:2px solid var(--red)}
.gantt-modal-inner::after{right:-1px;border-right:2px solid var(--red)}
.gantt-modal-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.gantt-modal-body{overflow:auto;padding:14px 8px 16px;flex:1;scrollbar-width:thin;scrollbar-color:var(--bg3) transparent}
.gantt-expand-btn{display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:none;border:1px solid var(--border2);color:var(--text3);font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:2px;transition:all .15s}
.gantt-expand-btn:hover{border-color:var(--red);color:var(--text)}

/* FOCUS / SPRINT */
.focus-card{background:var(--bg1);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:var(--radius);padding:16px 16px 14px;margin-bottom:12px}
.focus-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background .1s;margin-bottom:4px}
.focus-item:hover{background:var(--bg3)}
.focus-item.act{background:var(--bg3)}
.sprint-panel{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px;margin-bottom:12px;border-top:2px solid var(--red)}
.dur-row{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.dur-btn{font-size:10px;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg2);color:var(--text3);cursor:pointer;transition:all .15s;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.dur-btn:hover{border-color:var(--text2);color:var(--text)}
.dur-btn.on{background:var(--red);border-color:var(--red);color:white}
.timer-row{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.t-circle{position:relative;width:76px;height:76px;flex-shrink:0}
.t-circle svg{transform:rotate(-90deg)}
.t-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:var(--mono);color:var(--text);letter-spacing:.02em}
.timer-btns{display:flex;flex-direction:column;gap:8px}
.sq-grid{display:flex;flex-wrap:wrap;gap:4px}
.sq{width:18px;height:18px;border-radius:2px;border:1px solid var(--border);background:var(--bg2)}
.sq.own{background:var(--red);border-color:var(--red)}
.sq.child{background:rgba(232,32,32,0.25);border-color:var(--red-mid)}
.sq.run{background:var(--bg3);border-color:var(--text2);outline:1px solid var(--text3);outline-offset:1px}

/* HABITS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{background:var(--bg1);border:1px solid var(--border);border-top:2px solid var(--red);border-radius:var(--radius);padding:16px 18px}
.stat-val{font-size:40px;font-weight:800;line-height:1;color:var(--text);font-family:var(--mono)}
.stat-sub{font-size:10px;color:var(--text3);margin-top:6px;text-transform:uppercase;letter-spacing:.18em;font-weight:700;font-family:var(--mono)}
.hab-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.hab-row:last-child{border-bottom:none}
.h-ck{width:26px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.h-name{flex:1;font-size:16px;font-weight:600;color:var(--text);letter-spacing:.01em}
.h-name.done{color:var(--text3);text-decoration:line-through}
.h-streak{font-size:10px;font-weight:700;padding:3px 8px;border-radius:2px;font-family:var(--mono);background:var(--bg3);color:var(--text2);letter-spacing:.06em}
.hm-cell{width:100%;aspect-ratio:1;border-radius:2px;min-height:11px;transition:transform .1s;cursor:pointer}
.hm-cell:hover{transform:scale(1.3);z-index:1;position:relative}
.chart-bars{display:flex;align-items:flex-end;gap:2px;height:80px}
.cbar{flex:1;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s}
.chart-empty{height:80px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em}

/* HISTORY */
.cal-table{width:100%;border-collapse:separate;border-spacing:3px}
.cal-wd{font-size:9px;color:var(--text3);text-align:center;padding-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono)}
.cal-cell{background:var(--bg2);border-radius:3px;text-align:center;padding:5px 2px;cursor:pointer;border:1px solid transparent;transition:border-color .15s}
.cal-cell.today{border-color:var(--red)}
.cal-cell.has-sp{background:var(--red-dim)}
.cal-cell.has-go{background:rgba(57,201,118,0.12)}
.cal-cell.both{background:var(--red)}
.cal-cell.empty{background:transparent}
.cal-day{font-size:12px;font-weight:700;color:var(--text2);font-family:var(--mono)}
.has-sp .cal-day{color:var(--red)}
.has-go .cal-day{color:#39c976}
.both .cal-day{color:white}
.cal-cnt{font-size:8px;color:var(--text3);margin-top:1px;font-family:var(--mono)}
.both .cal-cnt{color:rgba(255,255,255,0.7)}
.hist-day{margin-bottom:18px}
.hist-date{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em}
.hist-pill{font-size:10px;padding:2px 8px;border-radius:2px;font-weight:700;font-family:var(--mono)}
.hist-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:8px;height:8px;border-radius:1px;flex-shrink:0;margin-top:5px}

/* FW */
.woop-card{border-radius:var(--radius);padding:18px;margin-bottom:12px;border:1px solid var(--border);background:var(--bg1);border-left-width:3px}
.woop-card.w{border-left-color:#9b7fff}
.woop-card.o1{border-left-color:var(--green)}
.woop-card.o2{border-left-color:var(--red)}
.woop-card.p{border-left-color:#f5a623}
.woop-card.plan{border-left-color:var(--green)}
.woop-letter{font-size:36px;font-weight:800;line-height:1;margin-bottom:4px;font-family:var(--mono)}
.woop-hint{font-size:13px;color:var(--text2);margin-bottom:10px;line-height:1.6;font-weight:500}
.woop-example{font-size:12px;color:var(--text3);font-style:italic;border-left:2px solid var(--border2);padding:7px 12px;margin-bottom:12px;line-height:1.6;background:var(--bg2);font-family:var(--mono)}
.fw-progress{height:2px;background:var(--bg3);overflow:hidden;margin-bottom:18px}
.fw-progress-fill{height:100%;background:var(--red);transition:width .4s}
.fw-saved-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg1);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:var(--radius);margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s}
.fw-saved-item:hover{background:var(--bg2);border-color:var(--text2);border-left-color:var(--red)}
.hta-node{position:relative;margin-bottom:4px}
.hta-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-sm);background:var(--bg2);border:1px solid var(--border)}
.hta-id{font-size:11px;font-weight:700;color:var(--red);font-family:var(--mono);flex-shrink:0;min-width:22px}
.hta-text{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.hta-kids{padding-left:20px;border-left:1px solid var(--border);margin-left:14px;margin-top:4px}
.hta-add-inline{display:none;gap:6px;padding:5px 10px;align-items:center}
.hta-add-inline.open{display:flex}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="app" id="app">
<div class="notify" id="notify"></div>

<!-- FW TAB -->
<div class="tab active" id="tab-fw">
  <div class="page-header">
    <div class="hud-scan"></div>
    <div class="page-title">Goal Framework</div>
  </div>
  <div class="sec">
    <div id="fw-list">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div style="font-size:11px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em">Draft with WOOP before pipeline</div>
        <button class="btn btn-purple" onclick="fwNew()">+ NEW GOAL</button>
      </div>
      <div id="fw-items"></div>

<script>
(function(){
  const canvas=document.getElementById('bg-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,frame=0;const stars=[];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;stars.length=0;for(let i=0;i<200;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+0.2,phase:Math.random()*Math.PI*2,speed:0.3+Math.random()*0.7,red:Math.random()>0.6});}
  window.addEventListener('resize',resize);resize();
  function draw(){frame++;ctx.clearRect(0,0,W,H);const t=frame*0.012;for(const s of stars){const a=0.2+0.6*Math.abs(Math.sin(s.phase+t*s.speed));if(s.red){ctx.fillStyle=`rgba(232,32,32,${a*0.9})`;ctx.shadowColor='rgba(232,32,32,0.7)';ctx.shadowBlur=s.r*3;}else{ctx.fillStyle=`rgba(255,255,255,${a*0.5})`;ctx.shadowBlur=0;}ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;requestAnimationFrame(draw);}
  draw();
})();
</script>

<script>
const LS=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}};

const fmtDate=d=>{const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const TODAY=fmtDate();
const fmtShort=s=>{if(!s)return'';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en',{month:'short',day:'numeric'});};
const parseDt=s=>s?new Date(s+'T12:00:00'):null;

let goals=LS('lt2_goals')||[];
let habits=LS('lt2_habits')||[
  {id:'h1',name:'Morning check-in',color:'#e82020',done:false},

  {id:'h4',name:'Daily DT',color:'#e82020',done:false}
];

let history=LS('lt2_history')||[];
let woops=LS('lt2_woops')||[];
let sprintDur=LS('lt2_dur')||5;
let activeGoalIdx=0,activeStepId=null,timerInt=null;
let swMode=false,swRunning=false,swSec=0,swInt=null;

// UI state — not persisted (collapses reset on refresh, intentional)
let nodeDateState={};  // nodeId -> bool open
let goalDateState={};  // goalId -> bool open

function saveAll(){LSS('lt2_goals',goals);LSS('lt2_timers',timers);LSS('lt2_habits',habits);LSS('lt2_history',history);LSS('lt2_woops',woops);LSS('lt2_dur',sprintDur);}

// ── GANTT / TIMELINE ──────────────────────────────
let ganttGoalId=null; // tracks which goal is expanded in modal

function collectRows(goal){
  const rows=[];
  function walk(node,depth){
    if(node.startDate||node.deadline)
      rows.push({id:node.id,name:node.name,start:node.startDate||null,end:node.deadline||null,depth,done:node.done||false});
    (node.children||[]).forEach(c=>walk(c,depth+1));
  }
  walk(goal,0);
  return rows;
}

function buildGanttSVG(goal,svgW){
  const rows=collectRows(goal);
  if(!rows.length)return null;
  const allDates=[];
  rows.forEach(r=>{if(r.start)allDates.push(parseDt(r.start));if(r.end)allDates.push(parseDt(r.end));});
  if(!allDates.length)return null;
  let minD=new Date(Math.min(...allDates)),maxD=new Date(Math.max(...allDates));
  const span=Math.max(maxD-minD,86400000*7);
  minD=new Date(minD-span*0.04);maxD=new Date(maxD+span*0.04);
  const totalMs=maxD-minD;
  const LABEL_W=Math.round(svgW*0.22);
  const BAR_X=LABEL_W+4,BAR_W=svgW-LABEL_W-12;
  const ROW_H=24,HEADER_H=26;
  const SVG_H=HEADER_H+rows.length*ROW_H+14;
  const todayD=parseDt(TODAY);
  const pct=d=>Math.max(0,Math.min(1,(d-minD)/totalMs));
  const bx=d=>BAR_X+pct(d)*BAR_W;
  const nTicks=Math.min(6,Math.floor(svgW/90));
  const ticks=[];for(let i=0;i<=nTicks;i++)ticks.push(new Date(minD.getTime()+totalMs*(i/nTicks)));
  const barColors=['#e82020','rgba(232,32,32,0.6)','rgba(232,32,32,0.35)','rgba(200,200,200,0.2)'];
  const getCol=(depth,done)=>done?'rgba(57,201,118,0.6)':barColors[Math.min(depth,3)];

  let svg=`<svg width="${svgW}" height="${SVG_H}" viewBox="0 0 ${svgW} ${SVG_H}" xmlns="http://www.w3.org/2000/svg">`;

  // tick grid + labels
  ticks.forEach(td=>{
    const tx=bx(td);
    svg+=`<line x1="${tx}" y1="${HEADER_H}" x2="${tx}" y2="${SVG_H-6}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
    svg+=`<text x="${tx}" y="${HEADER_H-5}" text-anchor="middle" fill="rgba(255,255,255,0.22)" font-size="7.5" font-family="'Space Mono',monospace">${td.toLocaleDateString('en',{month:'short',day:'numeric'})}</text>`;
  });

  // today line
  if(todayD>=minD&&todayD<=maxD){
    const tx=bx(todayD);
    svg+=`<line x1="${tx}" y1="${HEADER_H-2}" x2="${tx}" y2="${SVG_H-6}" stroke="#e82020" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.9"/>`;
    svg+=`<text x="${tx+3}" y="${HEADER_H+9}" fill="#e82020" font-size="7" font-family="'Space Mono',monospace" font-weight="700">TODAY</text>`;
  }

  // rows
  rows.forEach((r,i)=>{
    const ry=HEADER_H+i*ROW_H,mid=ry+ROW_H/2;
    const indent=r.depth*7;
    const maxCh=Math.floor((LABEL_W-indent-4)/5.2);
    const lbl=r.name.length>maxCh?r.name.slice(0,maxCh-1)+'…':r.name;
    svg+=`<text x="${indent+2}" y="${mid}" dominant-baseline="middle" fill="${r.depth===0?'rgba(255,255,255,0.92)':'rgba(176,176,176,0.7)'}" font-size="${r.depth===0?9:8}" font-weight="${r.depth===0?'700':'400'}" font-family="'Space Mono',monospace">${esc(lbl)}</text>`;

    if(r.start||r.end){
      const sx=r.start?bx(parseDt(r.start)):bx(minD);
      const ex=r.end?bx(parseDt(r.end)):bx(maxD);
      const bw=Math.max(ex-sx,4),bh=r.depth===0?14:10,by=mid-bh/2;
      svg+=`<rect x="${sx}" y="${by}" width="${bw}" height="${bh}" rx="2" fill="${getCol(r.depth,r.done)}"/>`;
      if(r.start)svg+=`<line x1="${sx}" y1="${by}" x2="${sx}" y2="${by+bh}" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>`;
      if(r.end){const dx=sx+bw;svg+=`<polygon points="${dx},${mid-5} ${dx+4},${mid} ${dx},${mid+5} ${dx-4},${mid}" fill="${r.depth===0?'#e82020':'rgba(232,32,32,0.7)'}"/>`;}
      if(bw>28&&r.start&&r.end){
        const days=Math.round((parseDt(r.end)-parseDt(r.start))/86400000);
        const dl=days<7?days+'d':Math.round(days/7)+'w';
        svg+=`<text x="${sx+bw/2}" y="${mid}" text-anchor="middle" dominant-baseline="middle" fill="rgba(255,255,255,0.75)" font-size="7" font-family="'Space Mono',monospace">${dl}</text>`;
      }
    }
    svg+=`<line x1="0" y1="${ry+ROW_H-1}" x2="${svgW}" y2="${ry+ROW_H-1}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>`;
  });
  svg+=`<rect x="${BAR_X}" y="${SVG_H-6}" width="${BAR_W}" height="1.5" fill="rgba(255,255,255,0.1)"/>`;
  svg+=`</svg>`;
  return{svg,svgW,SVG_H};
}

function renderGantt(goal){
  const res=buildGanttSVG(goal,500);
  if(!res)return'';
  return`<div class="gantt-wrap">
    <div class="gantt-header">
      <div class="gantt-title">Timeline &amp; Gantt</div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="font-size:8px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.08em">◆ deadline &nbsp;― today</div>
        <button class="gantt-expand-btn" onclick="openGanttModal('${goal.id}')">⤢ EXPAND</button>
      </div>
    </div>
    <div class="gantt-svg-wrap">${res.svg}</div>
  </div>`;
}

function openGanttModal(gid){

  else{body.innerHTML=`<div class="empty-state">No dates set on any steps yet</div>`;}
  modal.classList.add('open');
}

    </div>
    ${!w.transferred?`<button class="btn btn-green" style="width:100%;padding:14px;font-size:13px;margin-bottom:10px;letter-spacing:.1em" onclick="fwTransfer('${w.id}')">ADD TO GOALS PIPELINE →</button>`:''}
    <button class="btn btn-danger" style="width:100%;padding:12px;font-size:12px;letter-spacing:.1em" onclick="fwDelete('${w.id}')">DELETE DRAFT</button>
  `;
}

function fwRenderPlanHtml(w){if(!w.plan.steps||!w.plan.steps.length)return`<div style="font-size:11px;color:var(--text3);padding:4px 0;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em">No steps yet</div>`;return w.plan.steps.map((s,i)=>fwRenderNode(s,i+1,[])).join('');}
function fwRenderNode(node,idx,path){
  const myPath=[...path,idx].join('.');const key=myPath.replace(/\./g,'-');const hasC=node.children&&node.children.length>0;
  let h=`<div class="hta-node"><div class="hta-row"><span class="hta-id">${myPath}</span><span class="hta-text">${esc(node.name)}</span>
    ${node.sprint?`<span style="font-size:9px;padding:2px 6px;border-radius:2px;background:var(--red);color:white;flex-shrink:0;font-family:var(--mono);font-weight:700">${node.sprint}M</span>`:''}
    <button class="btn btn-ghost btn-xs" onclick="fwShowInline('${myPath}')">+</button>
    <button class="btn btn-danger btn-xs" onclick="fwRemoveStep('${myPath}')">×</button></div>
    <div class="hta-add-inline" id="fwai-${key}">
      <input class="inp" type="text" id="fwai-inp-${key}" placeholder="SUB-STEP..." style="font-size:11px;padding:5px 9px" onkeydown="if(event.key==='Enter')fwAddStep('${myPath}')">
      <input class="inp" type="number" id="fwai-sp-${key}" placeholder="min" style="width:50px;padding:5px 8px;font-size:11px">
      <button class="btn btn-green btn-xs" onclick="fwAddStep('${myPath}')">ADD</button>
      <button class="btn btn-ghost btn-xs" onclick="fwHideInline('${myPath}')">×</button>
    </div>`;
  if(hasC)h+=`<div class="hta-kids">${node.children.map((c,ci)=>fwRenderNode(c,ci+1,[...path,idx])).join('')}</div>`;
  return h+`</div>`;
}
function fwShowInline(path){const el=document.getElementById('fwai-'+path.replace(/\./g,'-'));if(el){el.classList.add('open');const inp=document.getElementById('fwai-inp-'+path.replace(/\./g,'-'));if(inp)inp.focus();}}
function fwHideInline(path){const el=document.getElementById('fwai-'+path.replace(/\./g,'-'));if(el)el.classList.remove('open');}
function fwGetNodeByPath(steps,path){const parts=path.split('.').map(Number);let cur=steps,node=null;for(const p of parts){node=cur[p-1];if(!node)return null;cur=node.children||[];}return node;}
function fwAddStep(parentPath){
  const w=fwGet();if(!w)return;let name,sprint;
  if(parentPath){const key=parentPath.replace(/\./g,'-');name=(document.getElementById('fwai-inp-'+key)||{}).value?.trim();const spv=(document.getElementById('fwai-sp-'+key)||{}).value;sprint=spv?parseInt(spv):null;}
  else{name=(document.getElementById('fw-step-inp')||{}).value?.trim();sprint=null;}
  if(!name)return;
  const node={id:uid(),name,children:[],sprint};
  if(!parentPath){if(!w.plan.steps)w.plan.steps=[];w.plan.steps.push(node);}
  else{const par=fwGetNodeByPath(w.plan.steps,parentPath);if(par){if(!par.children)par.children=[];par.children.push(node);}}
  saveAll();const tree=document.getElementById('fw-plan-tree');if(tree)tree.innerHTML=fwRenderPlanHtml(w);
  if(!parentPath){const inp=document.getElementById('fw-step-inp');if(inp)inp.value='';}else fwHideInline(parentPath);
}
function fwRemoveStep(path){
  const w=fwGet();if(!w)return;const parts=path.split('.').map(Number);
  if(parts.length===1){w.plan.steps.splice(parts[0]-1,1);}
  else{const par=fwGetNodeByPath(w.plan.steps,parts.slice(0,-1).join('.'));if(par&&par.children)par.children.splice(parts[parts.length-1]-1,1);}
  saveAll();const tree=document.getElementById('fw-plan-tree');if(tree)tree.innerHTML=fwRenderPlanHtml(w);
}
function fwStepsToGoalChildren(steps){if(!steps||!steps.length)return[];return steps.map(s=>({id:uid(),name:s.name,done:false,collapsed:false,inFocus:false,startDate:'',deadline:'',children:fwStepsToGoalChildren(s.children)}));}
function fwTransfer(id){
  const w=woops.find(x=>x.id===id);if(!w)return;
  if(!w.title&&!w.wish){showNotify('ADD A TITLE FIRST');return;}
  const name=w.title||w.wish||'Untitled';
  goals.push({id:uid(),name,overview:w.overview,wish:w.wish,outcome:w.outcome,obstacle:w.obstacle,collapsed:false,startDate:'',deadline:'',children:fwStepsToGoalChildren(w.plan.steps||[]),fromWoop:id});
  w.transferred=true;saveAll();if(fwEditingId===id)fwRenderEditor();
  showNotify('"'+name+'" ADDED TO GOALS');setTimeout(()=>switchTab('goals'),1400);
}
function fwDelete(id){if(!confirm('Delete this draft?'))return;woops=woops.filter(w=>w.id!==id);saveAll();fwClose();}
function fwRenderList(){
  const container=document.getElementById('fw-items');const empty=document.getElementById('fw-empty');
  if(!woops.length){container.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  container.innerHTML=woops.map(w=>`<div class="fw-saved-item" onclick="fwOpen('${w.id}')">
    <div>
      <div style="font-size:15px;font-weight:700;margin-bottom:4px;letter-spacing:.02em">${esc(w.title||w.wish||'UNTITLED')}</div>
      <div style="font-size:10px;color:var(--text3);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase">${w.created}${w.transferred?' · IN GOALS':''} · ${(w.plan.steps||[]).length} STEPS</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      ${w.transferred?`<span style="font-size:10px;padding:2px 8px;border-radius:2px;background:rgba(57,201,118,0.12);color:var(--green);font-weight:700;font-family:var(--mono);letter-spacing:.1em">DONE</span>`:''}
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="var(--text3)" stroke-width="1.5" stroke-linecap="square"/></svg>
    </div>
  </div>`).join('');
}

// ── GOALS ──────────────────────────────────────
function findNode(id,arr){for(const n of arr){if(n.id===id)return n;const f=findNode(id,n.children);if(f)return f;}return null;}
function countChildSp(node){let t=0;node.children.forEach(c=>{const tm=timers[c.id];if(tm)t+=tm.done;t+=countChildSp(c);});return t;}
function getFocusNodes(arr,out=[]){arr.forEach(n=>{if(n.inFocus&&!n.done)out.push(n);getFocusNodes(n.children,out);});return out;}

function addGoalTop(){const inp=document.getElementById('new-goal-inp');const name=inp.value.trim();if(!name)return;goals.push({id:uid(),name,collapsed:false,startDate:'',deadline:'',children:[]});activeGoalIdx=goals.length-1;activeStepId=null;inp.value='';saveAll();renderGoalTabs();renderGoalContent();}
function selectGoal(i){activeGoalIdx=i;renderGoalTabs();renderGoalContent();}

function saveGoalDate(gid,field,val){const g=goals.find(x=>x.id===gid);if(g){g[field]=val;saveAll();renderGoalContent();}}
function saveNodeDate(nid,field,val){const n=findNode(nid,goals);if(n){n[field]=val;saveAll();renderGoalContent();}}

function addStep(pid){const inp=document.getElementById('ai-'+pid);if(!inp)return;const name=inp.value.trim();if(!name)return;const par=findNode(pid,goals);if(par)par.children.push({id:uid(),name,done:false,collapsed:false,inFocus:false,startDate:'',deadline:'',children:[]});inp.value='';const el=document.getElementById('ail-'+pid);if(el)el.classList.remove('open');saveAll();renderGoalContent();}
function addRootStep(gid){const inp=document.getElementById('root-inp-'+gid);if(!inp)return;const name=inp.value.trim();if(!name)return;const g=goals.find(x=>x.id===gid);if(g)g.children.push({id:uid(),name,done:false,collapsed:false,inFocus:false,startDate:'',deadline:'',children:[]});inp.value='';saveAll();renderGoalContent();}
function removeNode(id){function del(arr){for(let i=0;i<arr.length;i++){if(arr[i].id===id){arr.splice(i,1);return true;}if(del(arr[i].children))return true;}}del(goals);if(activeStepId===id)activeStepId=null;saveAll();renderGoalContent();}
function toggleDone(id){const n=findNode(id,goals);if(!n)return;n.done=!n.done;if(n.done){const sc=countChildSp(n)+(timers[id]?timers[id].done:0);history.push({type:'goal',name:n.name,date:TODAY,id,sprintCount:sc});}else{const idx=[...history].reverse().findIndex(h=>h.type==='goal'&&h.id===id);if(idx>=0)history.splice(history.length-1-idx,1);}saveAll();renderGoalContent();}
function toggleCollapse(id){const n=findNode(id,goals);if(n)n.collapsed=!n.collapsed;saveAll();renderGoalContent();}
function toggleFocus(id){const n=findNode(id,goals);if(n)n.inFocus=!n.inFocus;saveAll();renderGoalContent();}
function selectStep(id){activeStepId=id;if(!timers[id])timers[id]={done:0,running:false,sec:sprintDur*60,total:sprintDur*60};saveAll();renderGoalContent();}
function showInline(id){const el=document.getElementById('ail-'+id);if(el){el.classList.add('open');const inp=document.getElementById('ai-'+id);if(inp)inp.focus();}}
function hideInline(id){const el=document.getElementById('ail-'+id);if(el)el.classList.remove('open');}

function renderPNode(node,depth){
  const sel=activeStepId===node.id;const hasC=node.children.length>0;
  const t=timers[node.id];const totalSp=(t?t.done:0)+countChildSp(node);
  const fs=depth===0?'15px':'13px';const fw=depth===0?'700':'500';
  const hasDeadline=!!(node.deadline&&node.deadline!='');
  const hasAnyDate=!!(node.startDate||node.deadline);
  const isOverdue=hasDeadline&&node.deadline<TODAY&&!node.done;
  const deadlineBadge=hasDeadline?`<span class="p-date-badge has-date" style="${isOverdue?'color:#ff4444;border-color:#ff444488':''}">${isOverdue?'⚠ ':''}${fmtShort(node.deadline)}</span>`:'';
  const dOpen=nodeDateState[node.id]||false;

  return`<div class="p-node"><div class="p-row${sel?' sel':''}">
    <div class="p-dot${node.done?' done':''}${sel?' act':''}" onclick="toggleDone('${node.id}')"></div>
    <span class="p-name${node.done?' done':''}" onclick="selectStep('${node.id}')" style="font-size:${fs};font-weight:${fw}">${esc(node.name)}</span>
    ${deadlineBadge}
    ${totalSp>0?`<span class="p-sp-badge">${totalSp}SP</span>`:''}
    <div class="p-acts">
      <button class="date-toggle${dOpen?' open':''}${hasAnyDate?' has':''}" onclick="toggleNodeDates('${node.id}')" title="Toggle dates"><i class="arr">▸</i>${hasAnyDate?'<span style="font-size:9px;margin-left:1px">📅</span>':''}</button>
      ${hasC?`<button class="btn btn-ghost btn-xs" onclick="toggleCollapse('${node.id}')" style="font-size:11px">${node.collapsed?'▸':'▾'}</button>`:''}
      <button class="btn btn-ghost btn-xs" onclick="toggleFocus('${node.id}')" style="color:${node.inFocus?'var(--red)':'var(--text3)'}">DF</button>
      <button class="btn btn-ghost btn-xs" onclick="showInline('${node.id}')">+</button>
      <button class="btn btn-danger btn-xs" onclick="removeNode('${node.id}')">×</button>
    </div></div>
    <div class="node-dates${dOpen?' open':''}" id="nd-${node.id}">
      <div class="date-row">
        <div><div class="date-lbl">Start</div><input class="inp-date" type="date" value="${node.startDate||''}" onchange="saveNodeDate('${node.id}','startDate',this.value)"></div>
        <div><div class="date-lbl" style="${isOverdue?'color:#ff4444':''}">Deadline${isOverdue?' ⚠':''}</div><input class="inp-date" type="date" value="${node.deadline||''}" style="${isOverdue?'border-color:#ff444488;color:#ff4444':''}" onchange="saveNodeDate('${node.id}','deadline',this.value)"></div>
      </div>
    </div>
    <div class="add-inline" id="ail-${node.id}">
      <input class="inp" type="text" id="ai-${node.id}" placeholder="SUB-STEP..." style="font-size:12px;padding:7px 12px" onkeydown="if(event.key==='Enter')addStep('${node.id}')">
      <button class="btn btn-purple btn-xs" onclick="addStep('${node.id}')">ADD</button>
      <button class="btn btn-ghost btn-xs" onclick="hideInline('${node.id}')">CANCEL</button>
    </div>
    ${hasC&&!node.collapsed?`<div class="p-kids">${node.children.map(c=>renderPNode(c,depth+1)).join('')}</div>`:''}
  </div>`;
}

function fmtSW(s){const m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}

function renderSprintPanel(){
  if(!activeStepId)return'';
  const node=findNode(activeStepId,goals);if(!node)return'';
  if(!timers[activeStepId])timers[activeStepId]={done:0,running:false,sec:sprintDur*60,total:sprintDur*60};
  const t=timers[activeStepId];const childSp=countChildSp(node);
  const totalSq=Math.max(t.done+childSp+3,8);let sqs='';
  for(let i=0;i<totalSq;i++){const isOwn=i<t.done,isChild=!isOwn&&i<t.done+childSp;const isRun=!isOwn&&!isChild&&i===t.done+childSp&&(swMode?swRunning:t.running);sqs+=`<div class="sq${isOwn?' own':''}${isChild?' child':''}${isRun?' run':''}"></div>`;}
  let timerBlock='';
  if(swMode){
    timerBlock=`<div class="timer-row"><div class="t-circle"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="var(--bg3)" stroke-width="4"/><circle cx="38" cy="38" r="32" fill="none" stroke="var(--green)" stroke-width="4" stroke-dasharray="201" stroke-dashoffset="${swRunning?'0':'201'}" stroke-linecap="butt" style="transition:stroke-dashoffset 60s linear"/></svg><div class="t-num" style="color:${swRunning?'var(--green)':'var(--text)'}">${fmtSW(swSec)}</div></div>
    <div class="timer-btns"><button class="btn${swRunning?' btn-green':' btn-purple'}" onclick="toggleSW()">${swRunning?'STOP':'START'}</button><button class="btn" onclick="resetSW()">RESET</button></div></div>`;
  }else{
    const circ=201,off=circ*(1-t.sec/t.total);const m=Math.floor(t.sec/60),s=t.sec%60;
    timerBlock=`<div class="timer-row"><div class="t-circle"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="var(--bg3)" stroke-width="4"/><circle cx="38" cy="38" r="32" fill="none" stroke="var(--red)" stroke-width="4" stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="butt"/></svg><div class="t-num">${m}:${s<10?'0':''}${s}</div></div>
    <div class="timer-btns"><button class="btn btn-purple" onclick="toggleTimer()">${t.running?'PAUSE':'START'}</button><button class="btn" onclick="resetTimer()">RESET</button></div></div>`;
  }
  const goalData=goals[activeGoalIdx];
  const obstacle=goalData&&goalData.obstacle?`<div style="font-size:12px;color:var(--red);margin-bottom:12px;padding:10px 14px;background:var(--red-dim);border:1px solid var(--red-mid);border-left:3px solid var(--red);border-radius:var(--radius-sm);line-height:1.6;font-family:var(--mono)"><span style="font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px">⚠ OBSTACLE</span>${esc(goalData.obstacle)}</div>`:'';
  return`<div class="sprint-panel"><div class="card-label" style="margin-bottom:8px">Sprint</div>
    <div style="font-size:17px;font-weight:700;margin-bottom:12px;color:var(--text);letter-spacing:.02em">${esc(node.name)}</div>
    ${obstacle}
    <div class="dur-row">${[5,10,15,25].map(d=>`<button class="dur-btn${!swMode&&sprintDur===d?' on':''}" onclick="setDur(${d})">${d}M</button>`).join('')}
    <button class="dur-btn${swMode?' on':''}" onclick="setSwMode()">WATCH</button></div>
    ${timerBlock}
    <div style="font-size:10px;color:var(--text3);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px">${t.done} OWN · ${childSp} SUB-STEPS</div>
    <div class="sq-grid">${sqs}</div>
  </div>`;
}

function renderGoalTabs(){const el=document.getElementById('goal-tabs');if(!el)return;el.innerHTML=goals.map((g,i)=>`<button class="gtab${i===activeGoalIdx?' on':''}" onclick="selectGoal(${i})">${esc(g.name.toUpperCase())}</button>`).join('');}

function renderGoalContent(){
  const el=document.getElementById('goal-content');if(!el)return;
  if(!goals.length){el.innerHTML=`<div class="empty-state">No goals yet<br>Add one above</div>`;return;}
  if(activeGoalIdx>=goals.length)activeGoalIdx=0;
  const g=goals[activeGoalIdx];if(!g){el.innerHTML='';return;}
  const focusNodes=getFocusNodes(g.children);

  // Gantt chart (only if any dates set)
  let h=renderGantt(g);

  // Goal-level dates card — collapsible
  const isOverdue=g.deadline&&g.deadline<TODAY&&!g.done;
  const gdOpen=goalDateState[g.id]||false;
  const gdHas=!!(g.startDate||g.deadline);
  h+=`<div class="card" style="margin-bottom:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="card-label" style="margin-bottom:0">Goal dates${gdHas&&!gdOpen?`<span style="margin-left:8px;font-size:9px;color:var(--red);font-weight:700;letter-spacing:.04em;font-style:normal">${g.startDate?fmtShort(g.startDate):'?'} → ${g.deadline?fmtShort(g.deadline):'?'}${isOverdue?' ⚠':''}</span>`:''}</div>
      <button class="date-toggle${gdOpen?' open':''}${gdHas?' has':''}" onclick="toggleGoalDates('${g.id}')"><i class="arr">▸</i> <span style="margin-left:2px">DATES</span></button>
    </div>
    <div class="goal-dates-body${gdOpen?' open':''}" id="gd-${g.id}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:10px">
        <div><div class="date-lbl">Start date</div><input class="inp-date" type="date" value="${g.startDate||''}" onchange="saveGoalDate('${g.id}','startDate',this.value)"></div>
        <div><div class="date-lbl" style="${isOverdue?'color:#ff4444':''}">Deadline${isOverdue?' ⚠':''}</div><input class="inp-date" type="date" value="${g.deadline||''}" style="${isOverdue?'border-color:#ff444488;color:#ff4444':''}" onchange="saveGoalDate('${g.id}','deadline',this.value)"></div>
      </div>
    </div>
  </div>`;

  h+=renderSprintPanel();

  if(g.wish||g.obstacle){
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      ${g.wish?`<div style="background:var(--bg1);border:1px solid var(--border);border-left:3px solid #9b7fff;border-radius:var(--radius-sm);padding:12px 14px"><div style="font-size:10px;font-weight:700;color:#9b7fff;text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px;font-family:var(--mono)">WISH</div><div style="font-size:13px;color:var(--text2);line-height:1.5;font-weight:500">${esc(g.wish)}</div></div>`:''}
      ${g.obstacle?`<div style="background:var(--bg1);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:var(--radius-sm);padding:12px 14px"><div style="font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px;font-family:var(--mono)">OBSTACLE</div><div style="font-size:13px;color:var(--text2);line-height:1.5;font-weight:500">${esc(g.obstacle)}</div></div>`:''}
    </div>`;
  }

  h+=`<div class="focus-card"><div class="card-label" style="margin-bottom:8px;color:var(--red)">Daily Focus <span style="font-weight:400;color:var(--text4)">— TAP DF ON ANY STEP</span></div>`;
  if(focusNodes.length){focusNodes.forEach(n=>{const isSel=activeStepId===n.id;const sp=timers[n.id]?timers[n.id].done:0;h+=`<div class="focus-item${isSel?' act':''}" onclick="selectStep('${n.id}')">
    <div style="width:6px;height:6px;border-radius:1px;background:${isSel?'var(--red)':'var(--text4)'};flex-shrink:0"></div>
    <span style="flex:1;font-size:15px;color:${isSel?'var(--text)':'var(--text2)'};font-weight:${isSel?'700':'500'}">${esc(n.name)}</span>
    ${sp>0?`<span style="font-size:10px;color:var(--red);font-weight:700;font-family:var(--mono)">${sp}SP</span>`:''}
    <button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();toggleFocus('${n.id}')">✕</button>
  </div>`;});}else{h+=`<div style="font-size:12px;color:var(--text3);padding:6px 0;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em">NO ITEMS — TAP DF ON ANY STEP</div>`;}
  h+=`</div>`;

  h+=`<div class="card"><div class="card-label">Pipeline</div>
    ${g.children.length?g.children.map(n=>renderPNode(n,0)).join(''):`<div style="font-size:12px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em">NO STEPS YET</div>`}
    <div class="divider" style="margin:14px 0 12px"></div>
    <div class="row"><input class="inp" type="text" id="root-inp-${g.id}" placeholder="ADD STEP TO THIS GOAL..." onkeydown="if(event.key==='Enter')addRootStep('${g.id}')"><button class="btn btn-purple" onclick="addRootStep('${g.id}')">+ STEP</button></div>
  </div>`;
  el.innerHTML=h;
}

function setDur(min){const t=timers[activeStepId];if(t&&t.running)return;swMode=false;sprintDur=min;if(t){t.sec=min*60;t.total=min*60;}saveAll();renderGoalContent();}
function setSwMode(){if(timers[activeStepId]&&timers[activeStepId].running)return;swMode=true;swRunning=false;swSec=0;renderGoalContent();}
function toggleSW(){swRunning=!swRunning;if(swRunning){swInt=setInterval(()=>{swSec++;renderGoalContent();},1000);}else{clearInterval(swInt);swInt=null;if(swSec>0){const t=timers[activeStepId];if(t)t.done++;const node=findNode(activeStepId,goals);history.push({type:'sprint',name:node?node.name:'',date:TODAY,stepId:activeStepId,duration:swSec});swSec=0;saveAll();}renderGoalContent();showNotify('SPRINT DONE');}}
function resetSW(){clearInterval(swInt);swInt=null;swRunning=false;swSec=0;renderGoalContent();}
function toggleTimer(){
  const t=timers[activeStepId];if(!t)return;
  if(t.running){clearInterval(timerInt);timerInt=null;t.running=false;}
  else{t.running=true;clearInterval(timerInt);
    timerInt=setInterval(()=>{const tt=timers[activeStepId];if(!tt||!tt.running){clearInterval(timerInt);timerInt=null;return;}tt.sec--;
      if(tt.sec<=0){tt.done++;tt.running=false;tt.sec=tt.total;const node=findNode(activeStepId,goals);history.push({type:'sprint',name:node?node.name:'',date:TODAY,stepId:activeStepId,duration:sprintDur*60});clearInterval(timerInt);timerInt=null;saveAll();renderGoalContent();showNotify('SPRINT DONE');return;}
      saveAll();renderGoalContent();},1000);}
  saveAll();renderGoalContent();
}
function resetTimer(){clearInterval(timerInt);timerInt=null;const t=timers[activeStepId];if(t){t.running=false;t.sec=t.total;}saveAll();renderGoalContent();}

// ── HABITS ──────────────────────────────────────
function getHlog(){return LS('lt2_hlog')||{};}
function getHabitStreak(hid){const log=getHlog();let s=0,d=new Date();while(true){const k=fmtDate(d);if(log[k]&&log[k][hid])s++;else break;d.setDate(d.getDate()-1);}return s;}
function calcStreak(){const log=getHlog();let s=0,d=new Date();while(true){const k=fmtDate(d);const done=habits.filter(h=>log[k]&&log[k][h.id]).length;if(done>=Math.max(1,habits.length))s++;else break;d.setDate(d.getDate()-1);}return s;}
function toggleHabit(i){habits[i].done=!habits[i].done;const log=getHlog();if(!log[TODAY])log[TODAY]={};log[TODAY][habits[i].id]=habits[i].done;LSS('lt2_hlog',log);saveAll();renderHabits();renderHeatmap();renderCompound();}
function removeHabit(i){habits.splice(i,1);saveAll();renderHabits();renderHeatmap();renderCompound();}
function addHabit(){const inp=document.getElementById('h-input');const name=inp.value.trim();if(!name)return;habits.push({id:uid(),name,color:'#e82020',done:false});inp.value='';saveAll();renderHabits();renderHeatmap();renderCompound();}

function renderHabits(){
  const done=habits.filter(h=>h.done).length;
  document.getElementById('h-today').textContent=done+'/'+habits.length;
  document.getElementById('h-streak').textContent=calcStreak()+'d';
  const list=document.getElementById('habit-list');
  if(!habits.length){list.innerHTML=`<div class="empty-state" style="padding:20px 0">No habits yet</div>`;return;}
  list.innerHTML=habits.map((h,i)=>`<div class="hab-row">
    <div class="h-ck" onclick="toggleHabit(${i})" style="${h.done?'background:var(--red);border-color:var(--red)':'border-color:var(--border2)'}">
      ${h.done?`<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1.5 6l3.5 3.5 6-6" stroke="white" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/></svg>`:''}
    </div>
    <span class="h-name${h.done?' done':''}">${esc(h.name)}</span>
    <span class="h-streak">${getHabitStreak(h.id)}D</span>
    <button class="btn btn-danger btn-xs" onclick="removeHabit(${i})">×</button>
  </div>`).join('');
}

// ── HEATMAP (FIXED) ─────────────────────────────
// Layout: day-label column on LEFT (rows = Mo..Su), then week columns going right.
// Each week column is flex-direction:column with 7 cells = exactly Mo..Su.
// We start the grid from the Monday of (today - 6 weeks) so day labels always align.
function renderHeatmap(){
  const wrap=document.getElementById('hm-outer');if(!wrap)return;
  const log=getHlog();
  const PAST=6,FUTURE=6,TOTAL=PAST+1+FUTURE; // 13 weeks
  const pal=['#1a1a1a','rgba(232,32,32,0.15)','rgba(232,32,32,0.35)','rgba(232,32,32,0.65)','#e82020'];
  const WD=['Mo','Tu','We','Th','Fr','Sa','Su'];

  const now=new Date();
  // Find this week's Monday
  const dow=now.getDay(); // 0=Sun..6=Sat
  const mondayOff=dow===0?6:dow-1;
  const thisMonday=new Date(now);
  thisMonday.setDate(now.getDate()-mondayOff);
  thisMonday.setHours(0,0,0,0);

  // Start = 6 weeks before this Monday
  const start=new Date(thisMonday);
  start.setDate(thisMonday.getDate()-PAST*7);

  // Build columns: each column = one week = 7 days Mon..Sun
  const cols=[];
  const mlabels=new Array(TOTAL).fill('');
  const monthSeen={};
  for(let w=0;w<TOTAL;w++){
    const col=[];
    for(let d=0;d<7;d++){
      const date=new Date(start);
      date.setDate(start.getDate()+w*7+d); // d=0→Mon, d=6→Sun
      const k=fmtDate(date);
      const isFut=k>TODAY;
      const dl=log[k]||{};
      const done=habits.filter(h=>dl[h.id]).length;
      const pct=habits.length>0?done/habits.length:0;
      let bg;
      if(isFut)bg='rgba(255,255,255,0.02)';
      else if(pct>=1)bg=pal[4];
      else if(pct>=.75)bg=pal[3];
      else if(pct>=.5)bg=pal[2];
      else if(pct>0)bg=pal[1];
      else bg=pal[0];
      col.push({k,bg,isFut,done,isToday:k===TODAY});
    }
    // Month label from Monday of this week
    const weekMonday=new Date(start);weekMonday.setDate(start.getDate()+w*7);
    const mk=weekMonday.getFullYear()+'-'+weekMonday.getMonth();
    if(!monthSeen[mk]){monthSeen[mk]=true;mlabels[w]=weekMonday.toLocaleDateString('en',{month:'short'}).toUpperCase();}
    cols.push(col);
  }

  // Cell size — calculate from available width (~440px minus label col 18px minus gaps)
  const CELL=13; // px per cell
  const GAP=3;

  let h=`<div style="display:flex;align-items:flex-start">`;
  // Day label column — each label height = CELL+GAP px, top offset = month-label row height (16px) + gap (3px)
  h+=`<div style="display:flex;flex-direction:column;gap:${GAP}px;margin-top:${16+GAP}px;margin-right:4px;flex-shrink:0">`;
  WD.forEach(l=>h+=`<div style="font-size:8px;color:var(--text3);height:${CELL}px;width:16px;display:flex;align-items:center;font-family:var(--mono);letter-spacing:.04em">${l}</div>`);
  h+=`</div>`;

  // Week grid
  h+=`<div style="flex:1;min-width:0">`;
  // Month labels row
  h+=`<div style="display:flex;gap:${GAP}px;margin-bottom:${GAP}px;height:16px">`;
  mlabels.forEach((lbl,i)=>h+=`<div style="flex:1;min-width:0;font-size:8px;color:${i===PAST?'var(--red)':'var(--text3)'};font-family:var(--mono);overflow:hidden;white-space:nowrap;font-weight:${i===PAST?'700':'400'};line-height:16px">${lbl}</div>`);
  h+=`</div>`;
  // Week columns
  h+=`<div style="display:flex;gap:${GAP}px">`;
  cols.forEach((col,wi)=>{
    h+=`<div style="display:flex;flex-direction:column;gap:${GAP}px;flex:1;min-width:0">`;
    col.forEach(cell=>{
      const ts=cell.isToday?`;outline:1px solid var(--red);outline-offset:1px;z-index:1;position:relative`:'';
      h+=`<div class="hm-cell" style="background:${cell.bg}${cell.isFut?';opacity:.2':''}${ts};height:${CELL}px" title="${cell.k}: ${cell.done}/${habits.length}"></div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;
  // Today indicator
  h+=`<div style="position:relative;height:14px;margin-top:3px">`;
  h+=`<div style="position:absolute;left:${Math.round(PAST/TOTAL*100)}%;transform:translateX(-50%);font-size:8px;color:var(--red);font-weight:700;font-family:var(--mono);white-space:nowrap">today</div>`;
  h+=`</div></div></div>`;
  // Legend
  h+=`<div style="display:flex;align-items:center;gap:3px;margin-top:6px">`;
  h+=`<span style="font-size:9px;color:var(--text3);margin-right:2px;font-family:var(--mono);letter-spacing:.06em">LESS</span>`;
  pal.forEach(c=>h+=`<div style="width:10px;height:10px;border-radius:2px;background:${c}"></div>`);
  h+=`<span style="font-size:9px;color:var(--text3);margin-left:2px;font-family:var(--mono);letter-spacing:.06em">MORE</span></div>`;
  wrap.innerHTML=h;
}

function renderCompound(){
  const wrap=document.getElementById('compound-wrap');if(!wrap)return;
  const log=getHlog();const gr=1.01,dr=0.97;
  let sc=1,bars=[],hasAny=false;
  for(let i=89;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=fmtDate(d);const done=habits.filter(h=>(log[k]||{})[h.id]).length;const pct=habits.length>0?done/habits.length:0;if(pct>0)hasAny=true;sc=pct>=.5?Math.min(sc*gr,3):Math.max(sc*dr,.5);bars.push({v:sc,d:new Date(d)});}
  if(!hasAny){wrap.innerHTML=`<div class="chart-empty">NO DATA YET</div>`;return;}
  const max=Math.max(...bars.map(b=>b.v));
  const tlItems=[];let lastMo=-1;
  bars.forEach((b,i)=>{const mo=b.d.getMonth();if(mo!==lastMo){tlItems.push({i,lbl:b.d.toLocaleDateString('en',{month:'short'}).toUpperCase()});lastMo=mo;}});
  const barsH=bars.map(b=>{const h=Math.round(b.v/max*100);const col=b.v>=1.5?'var(--red)':b.v>=1?'rgba(232,32,32,0.35)':'rgba(232,32,32,0.15)';return`<div class="cbar" style="height:${h}%;background:${col}"></div>`;}).join('');
  let tlH=`<div style="position:relative;height:14px;margin-top:5px">`;
  tlItems.forEach(it=>{const p=Math.round(it.i/89*100);tlH+=`<div style="position:absolute;left:${p}%;transform:translateX(-50%);font-size:8px;color:var(--text3);font-family:var(--mono);white-space:nowrap;letter-spacing:.06em">${it.lbl}</div>`;});
  tlH+=`</div>`;
  wrap.innerHTML=`<div style="background:var(--bg2);border-radius:3px;padding:12px"><div class="chart-bars">${barsH}</div>${tlH}</div>`;
}

// ── HISTORY ──────────────────────────────────────
function renderCalendar(){
  const now=new Date();const year=now.getFullYear(),month=now.getMonth();
  document.getElementById('cal-lbl').textContent=now.toLocaleDateString('en',{month:'long',year:'numeric'}).toUpperCase();
  const spByDay={},goByDay={};
  history.forEach(h=>{if(h.type==='sprint')spByDay[h.date]=(spByDay[h.date]||0)+1;if(h.type==='goal')goByDay[h.date]=(goByDay[h.date]||0)+1;});
  const firstDay=new Date(year,month,1).getDay();const daysInMonth=new Date(year,month+1,0).getDate();
  let html=`<tr>${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<td class="cal-wd">${d}</td>`).join('')}</tr><tr>`;
  let col=0;
  for(let i=0;i<firstDay;i++){html+=`<td class="cal-cell empty"></td>`;col++;}
  for(let day=1;day<=daysInMonth;day++){
    const k=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const sp=spByDay[k]||0,go=goByDay[k]||0;
    const cls=sp&&go?'both':sp?'has-sp':go?'has-go':'';
    let cnt='';if(sp&&go)cnt=`${sp}+${go}`;else if(sp)cnt=`${sp}s`;else if(go)cnt=`${go}g`;
    html+=`<td class="cal-cell${cls?' '+cls:''}${k===TODAY?' today':''}" title="${k}"><div class="cal-day">${day}</div>${cnt?`<div class="cal-cnt">${cnt}</div>`:''}</td>`;
    col++;if(col%7===0&&day<daysInMonth)html+=`</tr><tr>`;
  }
  while(col%7!==0){html+=`<td class="cal-cell empty"></td>`;col++;}
  document.getElementById('cal-table').innerHTML=html;
}
function renderHistory(){
  const el=document.getElementById('history-list');
  if(!history.length){el.innerHTML=`<div class="empty-state">No history yet</div>`;return;}
  const byDay={};history.forEach(h=>{if(!byDay[h.date])byDay[h.date]=[];byDay[h.date].push(h);});
  const days=Object.keys(byDay).sort().reverse();
  el.innerHTML=days.map(d=>{
    const isToday=d===TODAY;const items=byDay[d];
    return`<div class="hist-day"><div class="hist-date">${isToday?'TODAY':new Date(d+'T12:00').toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'}).toUpperCase()}
      <span class="hist-pill" style="background:var(--red);color:white">${items.length}</span></div>
      ${items.map(item=>{
        if(item.type==='sprint')return`<div class="hist-item"><div class="hist-dot" style="background:var(--red)"></div><div><div style="font-size:14px;font-weight:600">${esc(item.name)}</div><div style="font-size:10px;color:var(--text3);margin-top:3px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em">SPRINT · ${Math.round((item.duration||0)/60)}M</div></div></div>`;
        if(item.type==='goal')return`<div class="hist-item"><div class="hist-dot" style="background:var(--green)"></div><div><div style="font-size:14px;font-weight:600">${esc(item.name)}</div><div style="font-size:10px;color:var(--text3);margin-top:3px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em">GOAL COMPLETE · ${item.sprintCount||0}SP</div></div></div>`;
        return'';
      }).join('')}</div>`;
  }).join('');
}
